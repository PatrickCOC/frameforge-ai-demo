<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="FrameForge AI 動畫生成工作台——由文字提示建立分鏡、鏡頭與動畫預覽。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23070a12'/%3E%3Cpath d='M15 18h34v28H15z' fill='none' stroke='%235de1ff' stroke-width='4'/%3E%3Cpath d='m27 25 14 7-14 7z' fill='%23ffca6a'/%3E%3C/svg%3E" />
    <title>FrameForge — AI 動畫生成工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="FrameForge 首頁">
          <span class="brand-mark"><span></span></span>
          <span>FRAMEFORGE</span>
        </a>
        <nav class="project-nav" aria-label="專案導覽">
          <button class="nav-button active">工作台</button>
          <button class="nav-button">素材庫</button>
          <button class="nav-button">專案</button>
        </nav>
        <div class="top-actions">
          <span class="credits"><i></i> 2,480 點數</span>
          <button class="icon-button" aria-label="通知">⌁</button>
          <button class="avatar" aria-label="帳戶選單">PC</button>
        </div>
      </header>

      <main>
        <section class="workspace-head">
          <div>
            <p class="eyebrow">PROJECT / 霓虹雨夜</p>
            <h1>把一個念頭，變成會動的故事。</h1>
          </div>
          <div class="save-state"><span></span> 已自動儲存</div>
        </section>

        <section class="studio-grid">
          <aside class="control-panel" aria-label="動畫設定">
            <div class="panel-section prompt-section">
              <div class="section-label">
                <label for="prompt">描述你的動畫</label>
                <span id="promptCount">64 / 500</span>
              </div>
              <div class="prompt-box">
                <textarea id="prompt" maxlength="500">雨夜裡，一位旅人站在霓虹屋頂，看著發光列車穿越城市天際線。鏡頭緩慢推近，風吹起外套和絲帶。</textarea>
                <button class="spark-button" aria-label="優化提示詞" title="優化提示詞">✦</button>
              </div>
            </div>

            <div class="panel-section">
              <div class="section-label"><span>視覺風格</span><button class="text-button">查看全部</button></div>
              <div class="style-grid" role="radiogroup" aria-label="視覺風格">
                <button class="style-card active" data-style="手繪動畫" role="radio" aria-checked="true"><span class="style-swatch anime"></span><b>手繪動畫</b></button>
                <button class="style-card" data-style="電影寫實" role="radio" aria-checked="false"><span class="style-swatch cinema"></span><b>電影寫實</b></button>
                <button class="style-card" data-style="立體黏土" role="radio" aria-checked="false"><span class="style-swatch clay"></span><b>立體黏土</b></button>
              </div>
            </div>

            <div class="panel-section setting-pair">
              <div>
                <span class="mini-label">片長</span>
                <div class="segmented" data-group="duration">
                  <button>5 秒</button><button class="active">10 秒</button><button>15 秒</button>
                </div>
              </div>
              <div>
                <span class="mini-label">畫面比例</span>
                <div class="segmented" data-group="ratio">
                  <button class="active">16:9</button><button>9:16</button><button>1:1</button>
                </div>
              </div>
            </div>

            <div class="panel-section motion-row">
              <div><span class="mini-label">動態強度</span><b id="motionValue">自然</b></div>
              <input id="motion" type="range" min="0" max="100" value="56" aria-label="動態強度" />
              <div class="range-labels"><span>平穩</span><span>強烈</span></div>
            </div>

            <button class="generate-button" id="generateButton"><span>✦</span><b>生成動畫</b><small>約 120 點數</small></button>
          </aside>

          <section class="preview-panel" aria-label="動畫預覽">
            <div class="preview-toolbar">
              <div class="status-pill"><span></span><b id="statusText">草稿預覽</b></div>
              <div class="preview-actions">
                <button class="icon-button" aria-label="比較版本">◫</button>
                <button class="secondary-button" id="exportButton">匯出影片 <span>↗</span></button>
              </div>
            </div>

            <div class="stage-wrap">
              <div class="stage" id="stage">
                <img id="heroImage" src="./animation-keyframe.webp" alt="雨夜霓虹城市的動畫關鍵畫面" />
                <div class="film-grain"></div>
                <div class="frame-corners"></div>
                <button class="play-button" id="playButton" aria-label="播放動畫"><span>▶</span></button>
                <div class="stage-caption"><span>SHOT 01</span><b id="shotTitle">雨夜 · 天台遠景</b></div>
              </div>
              <div class="player-bar">
                <button id="miniPlay" aria-label="播放">▶</button>
                <span id="currentTime">00:00</span>
                <div class="scrubber"><i id="scrubProgress"></i><button aria-label="播放進度"></button></div>
                <span>00:10</span>
                <button aria-label="音量">◖))</button>
                <button aria-label="全螢幕">⛶</button>
              </div>
            </div>

            <div class="timeline-head">
              <div><p>鏡頭序列</p><span>3 個鏡頭 · 10 秒</span></div>
              <button class="add-shot">＋ 新增鏡頭</button>
            </div>
            <div class="shot-list" id="shotList">
              <button class="shot-card active" data-shot="雨夜 · 天台遠景"><span class="thumb thumb-one"></span><span class="shot-copy"><b>01</b><small>00:00–00:03</small></span></button>
              <button class="shot-card" data-shot="列車穿越城市"><span class="thumb thumb-two"></span><span class="shot-copy"><b>02</b><small>00:03–00:07</small></span></button>
              <button class="shot-card" data-shot="旅人的決定"><span class="thumb thumb-three"></span><span class="shot-copy"><b>03</b><small>00:07–00:10</small></span></button>
              <button class="shot-card add-card" aria-label="新增鏡頭"><span>＋</span><small>新增</small></button>
            </div>
          </section>
        </section>

        <section class="recent-strip">
          <div><p class="eyebrow">RECENT CREATIONS</p><h2>最近作品</h2></div>
          <article><span class="recent-art coast"></span><div><b>海岸晨光</b><small>12 秒 · 水彩風格</small></div></article>
          <article><span class="recent-art metro"></span><div><b>末班地下鐵</b><small>8 秒 · 電影寫實</small></div></article>
          <article><span class="recent-art garden"></span><div><b>漂浮花園</b><small>15 秒 · 立體黏土</small></div></article>
        </section>
      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
